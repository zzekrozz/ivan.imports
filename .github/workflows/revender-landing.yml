name: Landing de formación en vídeo
on:
  pull_request:
    paths:
      - 'como-encontrar-coches-para-revender/**'
      - 'docs/landing-final/**'
      - 'assets/hero-golf.webp'
      - 'assets/ad-golf.webp'
      - 'assets/video-thumb.webp'
      - 'assets/og-landing-revender.jpg'
      - 'assets/favicon/**'
      - 'assets/como-encontrar-coches/**'
      - 'assets/site.js'
      - 'assets/site-config.js'
      - 'assets/consent.*'
      - 'assets/legal-config.js'
      - 'scripts/*legal*'
      - 'scripts/consent-markup.mjs'
      - 'tests/consent-legal.test.js'
      - 'scripts/*revender*'
      - 'scripts/build-public-pages.mjs'
      - 'scripts/build-check.mjs'
      - 'tests/revender-landing.test.js'
      - '.github/workflows/revender-landing.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: test -f dist/como-encontrar-coches-para-revender/index.html
      - run: npm install --include=dev --no-save --package-lock=false @playwright/test@1.56.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-revender-landing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revender-responsive-qa
          path: qa-artifacts/
          if-no-files-found: ignore
